version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: molecule
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    depends_on:
      - db
    command: sh -c "npm run prisma:generate && npm run prisma:push && npm run seed && npm run dev"
    ports:
      - '4000:4000'
    volumes:
      - backend_uploads:/workspace/apps/backend/uploads

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    env_file: .env
    depends_on:
      - backend
    ports:
      - '3000:3000'

volumes:
  pgdata:
  backend_uploads:
